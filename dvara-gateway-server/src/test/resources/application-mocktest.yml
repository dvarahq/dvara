dvara:
  llm-gateway:
    providers:
      mock:
        enabled: true
        response: "Mock integration test response"
        latency-ms: 0
        stream-token-delay-ms: 0
        error-rate: 0.0
        matchers:
          - name: custom-model
            when: "request.model == 'mock/custom'"
            response: "Custom model response"
          - name: mid-conversation-system
            when: "request.model == 'mock/mid-system' && request.messages.size() == 2 && request.messages[1].role == 'system'"
            response: "system message in place"
