name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # For an existing tag whose image or GitHub Release did not get published. It publishes nothing
  # to Central. The image is built, with the Dockerfile of the branch it is run from, from the
  # tag's runnable jar: the GitHub Release's copy, else Central's (releases up to 1.12.0 put it
  # there), else one built from the tag. The GitHub Release is created on the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, such as 1.10.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/dvarahq/dvara-gateway-oss

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          # The `central` server id is what central-publishing-maven-plugin authenticates as
          # (publishingServerId in the release profile). The GPG key is imported here rather
          # than by a hand-rolled step so the passphrase never reaches a shell.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.CENTRAL_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The minor-line image tag (1.8), cut from the first two numbers. The semver rule in the
          # metadata action cannot read a four-part hotfix version such as 1.8.2.1.
          echo "stream=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # latest and the minor-line tag move only to the highest release. A tag push is the newest
          # release; a run for an older tag must not move them back.
          HIGHEST=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/v\{0,1\}||' | grep -v -- - | sort -V | tail -1)
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$VERSION" = "$HIGHEST" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $VERSION from tag $TAG (highest release: $HIGHEST)"

      # The version is read from the tagged commit, never set here. What is published must be what
      # the tag records, so that checking out the tag and building it gives the same artifact. A
      # tag on a commit whose poms say anything else stops the release before it builds or
      # publishes anything; scripts/cut-release.sh commits the version and tags that commit.
      - name: The committed version is the tag's version
        if: github.event_name == 'push'
        run: scripts/check-version-matches-tag.sh "${{ steps.version.outputs.version }}"

      - name: Build and test
        if: github.event_name == 'push'
        run: ./mvnw -B -ntp clean install

      # The credentials are checked BEFORE anything is published, and a missing one fails the
      # release rather than skipping the upload. A skip would produce the worst outcome available:
      # a GitHub Release and a pushed image for a version that has no Maven artifact, announced as
      # shipped. Nothing here is recoverable by re-running once the tag has been advertised, so the
      # cheap failure is the one that happens first.
      # A release candidate (a tag such as 1.8.5-rc1) is not published to Maven Central. Central
      # counts every release against a monthly limit and keeps it forever, and a candidate is for
      # testing: it gets the image and a GitHub prerelease with the runnable jar. Test a candidate
      # of a dependent build against the snapshot instead.
      - name: The Central credentials are present
        if: github.event_name == 'push' && steps.version.outputs.prerelease == 'false'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_KEY: ${{ secrets.CENTRAL_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -uo pipefail
          MISSING=""
          [ -n "${MAVEN_USERNAME:-}" ]  || MISSING="$MISSING CENTRAL_TOKEN_USERNAME"
          [ -n "${MAVEN_PASSWORD:-}" ]  || MISSING="$MISSING CENTRAL_TOKEN_PASSWORD"
          [ -n "${GPG_KEY:-}" ]         || MISSING="$MISSING CENTRAL_GPG_PRIVATE_KEY"
          [ -n "${GPG_PASSPHRASE:-}" ]  || MISSING="$MISSING MAVEN_GPG_PASSPHRASE"
          if [ -n "$MISSING" ]; then
            echo "::error::cannot publish to Maven Central — missing repository secret(s):$MISSING"
            echo "Central rejects an unsigned bundle, so all four are required. Set them in the"
            echo "repository's secrets, and verify the com.dvarahq namespace first: an upload for"
            echo "an unverified namespace is refused after the artifacts have been sent."
            exit 1
          fi
          echo "central credentials present"

      # Publishes to Maven Central. The `release` profile attaches the sources and javadoc jars
      # Central requires, signs everything with GPG, and turns on central-publishing-maven-plugin,
      # whose extensions=true takes over the deploy phase — so this does NOT go to the
      # distributionManagement repository (GitHub Packages) that a plain `deploy` would use.
      #
      # autoPublish is TRUE, so this uploads the bundle and RELEASES it. There is no staging pause
      # and nobody presses Publish in the Central portal — the moment this step succeeds the version
      # is public and permanent. A released version on Central can never be deleted, renamed or
      # replaced, so the tag is the point of no return rather than the portal: everything the
      # release depends on must be verified BEFORE the tag is pushed. Set autoPublish back to false
      # in the release profile to restore the manual gate.
      #
      # Tests are skipped because the step above already ran them on this exact tree.
      # Central's limits for the organization are 7 releases, 1,000 files and 80 MB a month, and a
      # release over them is refused once the grace period is used up. The bundle is built and
      # measured first, with nothing uploaded; scripts/central-budget.py says what the budget is
      # and how to pass it for a release that cannot wait (the CENTRAL_BUDGET_OVERRIDE variable).
      - name: The release fits Maven Central's monthly limits
        if: github.event_name == 'push' && steps.version.outputs.prerelease == 'false'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_BUDGET_OVERRIDE: ${{ vars.CENTRAL_BUDGET_OVERRIDE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -Prelease -DskipTests deploy -Ddvara.central.skipUpload=true
          python3 scripts/central-budget.py check-bundle target/central-publishing/central-bundle.zip --version "$VERSION"

      - name: Publish to Maven Central
        if: github.event_name == 'push' && steps.version.outputs.prerelease == 'false'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease -DskipTests deploy

      - name: Stage the runnable jar
        if: github.event_name == 'push'
        id: jar
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          JAR=dvara-gateway-server/target/dvara-gateway-server-$VERSION-app.jar
          test -f "$JAR" || { echo "::error::$JAR was not produced"; exit 1; }
          mkdir -p dvara-gateway-server/target/image
          cp "$JAR" dvara-gateway-server/target/image/app.jar
          (cd dvara-gateway-server/target && sha256sum "$(basename "$JAR")" > "$(basename "$JAR").sha256")
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      # The run for an existing tag takes the tag's runnable jar from, in order: the GitHub Release,
      # checked against the .sha256 published beside it; Maven Central, checked against Central's
      # own SHA-256 (releases up to 1.12.0 put it there); or a build of the tag. The first two
      # give the image exactly the jar that was released.
      - name: The released runnable jar
        if: github.event_name == 'workflow_dispatch'
        id: central-jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null \
            || { echo "::error::there is no tag $TAG"; exit 1; }
          NAME=dvara-gateway-server-$VERSION-app.jar
          OUT=dvara-gateway-server/target
          mkdir -p "$OUT/image"
          URL=https://repo1.maven.org/maven2/com/dvarahq/dvara-gateway-server/$VERSION/$NAME
          if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$NAME" -p "$NAME.sha256" -D "$OUT" --clobber 2>/dev/null; then
            (cd "$OUT" && sha256sum -c "$NAME.sha256")
            echo "the jar attached to the GitHub Release $TAG"
          elif curl -fsSL -o "$OUT/$NAME" "$URL"; then
            EXPECTED=$(curl -fsSL "$URL.sha256" | cut -d' ' -f1)
            (cd "$OUT" && echo "$EXPECTED  $NAME" | sha256sum -c - && sha256sum "$NAME" > "$NAME.sha256")
            echo "the jar on Maven Central"
          else
            echo "::notice::$NAME is neither on the GitHub Release nor on Maven Central; building it from $TAG"
            git fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git worktree add -q --detach "$RUNNER_TEMP/tag" "$TAG"
            (cd "$RUNNER_TEMP/tag" && ./mvnw -B -ntp -DskipTests -pl dvara-gateway-server -am package)
            cp "$RUNNER_TEMP/tag/$OUT/$NAME" "$OUT/$NAME"
            (cd "$OUT" && sha256sum "$NAME" > "$NAME.sha256")
          fi
          cp "$OUT/$NAME" "$OUT/image/app.jar"
          echo "path=$OUT/$NAME" >> "$GITHUB_OUTPUT"
          echo "revision=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: grabdoc
          password: ${{ secrets.GH_PUBLISH_PAT }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.stream }},enable=${{ steps.version.outputs.prerelease == 'false' && steps.version.outputs.newest == 'true' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' && steps.version.outputs.newest == 'true' }}
          labels: |
            org.opencontainers.image.title=DVARA Gateway (open source)
            org.opencontainers.image.description=The open-source LLM Gateway of the DVARA AI governance platform: an OpenAI-compatible API in front of OpenAI, Anthropic, Gemini, Bedrock, Ollama and more, with policy, PII detection and redaction, guardrails, rate limiting and an HMAC-chained audit log. One process, one gateway.yaml.
            org.opencontainers.image.documentation=https://dvarahq.com/docs
            org.opencontainers.image.licenses=Apache-2.0
            ${{ github.event_name == 'workflow_dispatch' && format('org.opencontainers.image.revision={0}', steps.central-jar.outputs.revision) || '' }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: dvara-gateway-server/target/image
          file: dvara-gateway-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ steps.jar.outputs.path || steps.central-jar.outputs.path }}
            ${{ steps.jar.outputs.path || steps.central-jar.outputs.path }}.sha256
