# The build: do the modules build, test and pass on their own, with nothing supplied.
#
# No build cache extension. A cached jar can come back with no classes in it, and the
# failure then shows up downstream as compile errors against classes that are present and
# correct. Nine modules build in a few minutes, so the cache is not worth that.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp clean install

  # Snapshots go to Maven Central's snapshot repository, which anybody can read with no
  # credential at all.
  #
  # They used to go to GitHub Packages, and the reason was that Central's snapshot repository
  # is public while this repository was not — a published jar is as good as published source.
  # That premise ended when the repository went public, and the cost it imposed was real and
  # paid by every consumer: resolving a snapshot needed a token with `read:packages`, so a
  # build pinned at unreleased open work could not run without one.
  #
  # Releases are NOT published from this workflow. A released version on Central can never be
  # deleted, so each one stays a deliberate act behind a tag — see release.yml.
  #
  # Snapshots are not signed, and that is Central's rule rather than an omission here: a GPG
  # signature is required on a release and not on a snapshot. So this job needs the portal
  # token only, and neither the signing key nor its passphrase.
  #
  # There is no longer a step that deletes the previous build of the snapshot. That existed
  # because GitHub Packages adds each deploy's jars to the version rather than replacing them
  # and then refuses uploads once the store is full. Central's snapshot repository does its own
  # retention, so the snapshot is no longer unavailable for a minute or two on every push.
  publish-snapshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # A release is cut as two commits on main: `Release X`, which carries the released version
      # and is tagged, then `Open <next>-SNAPSHOT`. scripts/cut-release.sh pushes both at once, so
      # main's head is normally the snapshot. If a push ever ends at the Release commit, there is
      # nothing for this job to publish: release.yml publishes that version from its tag, and a
      # deploy here would upload it by a second route. So the job skips, and the run stays green,
      # because a release commit on main is correct.
      - name: The version is a snapshot
        id: version
        run: |
          set -euo pipefail
          VERSION=$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$VERSION" in
            *-SNAPSHOT)
              echo "snapshot=true" >> "$GITHUB_OUTPUT"
              echo "publishing snapshot $VERSION" ;;
            *)
              echo "snapshot=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is a release version; release.yml publishes it from its tag, so no snapshot is deployed" ;;
          esac

      # This fails the run rather than skipping it. A publish step that quietly does nothing
      # when a secret is absent is indistinguishable from one nobody is consuming, and the
      # absence is then found by somebody whose build cannot resolve a version this repository
      # claims to publish — months later, and nowhere near the cause.
      - name: The Central credentials are present
        if: steps.version.outputs.snapshot == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${MAVEN_USERNAME:-}" ] || MISSING="$MISSING CENTRAL_TOKEN_USERNAME"
          [ -n "${MAVEN_PASSWORD:-}" ] || MISSING="$MISSING CENTRAL_TOKEN_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::missing repository secret(s):$MISSING"
            exit 1
          fi
          echo "Central credentials present"

      - name: Publish snapshot
        if: steps.version.outputs.snapshot == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          # Deliberately not -Prelease. That profile carries central-publishing-maven-plugin with
          # extensions=true, which takes over the deploy phase to build a release bundle for the
          # portal — the wrong mechanism for a snapshot, which is an ordinary Maven deploy.
          ./mvnw -B -ntp -DskipTests deploy \
            -DaltDeploymentRepository="central::https://central.sonatype.com/repository/maven-snapshots/"
