# The build: do the modules build, test and pass on their own, with nothing supplied.
#
# No build cache extension. A cached jar can come back with no classes in it, and the
# failure then shows up downstream as compile errors against classes that are present and
# correct. Nine modules build in a few minutes, so the cache is not worth that.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp clean install

  # Build the image on every change and start it. Otherwise the Dockerfile ran for the first time at
  # a release, when a broken step can no longer be fixed before the tag. linux/amd64 only: the point
  # is to run every step once, not to publish.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build the runnable jar
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -DskipTests -pl dvara-gateway-server -am package
          mkdir -p dvara-gateway-server/target/image
          cp dvara-gateway-server/target/dvara-gateway-server-*-app.jar dvara-gateway-server/target/image/app.jar

      - name: Build the image
        run: docker build -t dvara-gateway-oss:ci -f dvara-gateway-server/Dockerfile dvara-gateway-server/target/image

      # A wrong option must stop the boot: a check that a good one boots proves nothing. Then the good
      # ones are read back with where each came from: the image defaults from the environment, the
      # option added in JDK_JAVA_OPTIONS from the command line, winning over the default.
      - name: JVM options reach the JVM
        run: |
          set -euo pipefail
          if docker run --rm -e JDK_JAVA_OPTIONS=-XX:+DvaraNoSuchOption dvara-gateway-oss:ci > bogus.log 2>&1; then
            echo "::error::the image booted with an unknown JVM option, so options set there are not read"; exit 1
          fi
          grep -q "Unrecognized VM option 'DvaraNoSuchOption'" bogus.log \
            || { echo "::error::the boot failed, but not on the unknown option:"; cat bogus.log; exit 1; }
          docker run -d --name jvm-flags -e JDK_JAVA_OPTIONS="-XX:+PrintFlagsFinal -XX:MaxRAMPercentage=61" \
            dvara-gateway-oss:ci >/dev/null
          for _ in $(seq 1 30); do
            grep -q ' MaxRAMPercentage ' <<< "$(docker logs jvm-flags 2>&1)" && break
            sleep 1
          done
          flags=$(docker logs jvm-flags 2>&1)
          docker rm -f jvm-flags >/dev/null
          # Here-strings, not pipes: grep -q stops at its first match, and under pipefail the writer's SIGPIPE
          # would fail a check that had matched.
          for want in 'UseZGC *= true .*\{environment\}' 'AlwaysPreTouch *= true .*\{environment\}' \
                      'ExitOnOutOfMemoryError *= true .*\{environment\}' 'MaxRAMPercentage *= 61\.0* .*\{command line\}' \
                      'AOTCache *= /app/app\.aot .*\{command line\}'; do
            grep -q -E " $want" <<< "$flags" || { echo "::error::no flag matching '$want'"; exit 1; }
          done

      # The gateway starts and answers, from the AOT cache: a cache the JVM cannot use is skipped with a
      # log line rather than an error, so only the log shows it.
      - name: The image starts and uses its AOT cache
        run: |
          set -euo pipefail
          docker run -d --name gateway -p 8080:8080 dvara-gateway-oss:ci >/dev/null
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/actuator/health/liveness && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/actuator/health/liveness \
            || { docker logs gateway; echo "::error::the gateway did not answer its liveness probe"; exit 1; }
          if docker logs gateway 2>&1 | grep -q 'Unable to use AOT cache'; then
            docker logs gateway 2>&1 | grep -i aot; echo "::error::the JVM did not use the image's AOT cache"; exit 1
          fi
          docker rm -f gateway >/dev/null

  # Snapshots go to Maven Central's snapshot repository, which anybody can read with no
  # credential at all.
  #
  # They used to go to GitHub Packages, and the reason was that Central's snapshot repository
  # is public while this repository was not — a published jar is as good as published source.
  # That premise ended when the repository went public, and the cost it imposed was real and
  # paid by every consumer: resolving a snapshot needed a token with `read:packages`, so a
  # build pinned at unreleased open work could not run without one.
  #
  # Releases are NOT published from this workflow. A released version on Central can never be
  # deleted, so each one stays a deliberate act behind a tag — see release.yml.
  #
  # Snapshots are not signed, and that is Central's rule rather than an omission here: a GPG
  # signature is required on a release and not on a snapshot. So this job needs the portal
  # token only, and neither the signing key nor its passphrase.
  #
  # There is no longer a step that deletes the previous build of the snapshot. That existed
  # because GitHub Packages adds each deploy's jars to the version rather than replacing them
  # and then refuses uploads once the store is full. Central's snapshot repository does its own
  # retention, so the snapshot is no longer unavailable for a minute or two on every push.
  publish-snapshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # A release is cut as two pull requests merged into main: `Release X`, whose merge commit
      # carries the released version and is tagged, then the one that opens the next snapshot.
      # Between the two, main's head is the Release commit, and there is nothing for this job to
      # publish: release.yml publishes that version from its tag, and a deploy here would upload it
      # by a second route. So the job skips, and the run stays green, because a release commit on
      # main is correct.
      - name: The version is a snapshot
        id: version
        run: |
          set -euo pipefail
          VERSION=$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$VERSION" in
            *-SNAPSHOT)
              echo "snapshot=true" >> "$GITHUB_OUTPUT"
              echo "publishing snapshot $VERSION" ;;
            *)
              echo "snapshot=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is a release version; release.yml publishes it from its tag, so no snapshot is deployed" ;;
          esac

      # This fails the run rather than skipping it. A publish step that quietly does nothing
      # when a secret is absent is indistinguishable from one nobody is consuming, and the
      # absence is then found by somebody whose build cannot resolve a version this repository
      # claims to publish — months later, and nowhere near the cause.
      - name: The Central credentials are present
        if: steps.version.outputs.snapshot == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${MAVEN_USERNAME:-}" ] || MISSING="$MISSING CENTRAL_TOKEN_USERNAME"
          [ -n "${MAVEN_PASSWORD:-}" ] || MISSING="$MISSING CENTRAL_TOKEN_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::missing repository secret(s):$MISSING"
            exit 1
          fi
          echo "Central credentials present"

      - name: Publish snapshot
        if: steps.version.outputs.snapshot == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          # Deliberately not -Prelease. That profile carries central-publishing-maven-plugin with
          # extensions=true, which takes over the deploy phase to build a release bundle for the
          # portal — the wrong mechanism for a snapshot, which is an ordinary Maven deploy.
          ./mvnw -B -ntp -DskipTests deploy \
            -DaltDeploymentRepository="central::https://central.sonatype.com/repository/maven-snapshots/"
